name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      play:
        description: Also upload this build to Google Play (internal testing)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace
      - name: Pre-record warning phrases
        # Piper with the public-domain LJSpeech voice (trained from scratch on
        # LJSpeech); clips are bundled so warnings speak even without an
        # offline text-to-speech voice on the phone.
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          ./gradlew :core:speechCatalog
          mkdir -p build/tts
          curl -sSfL --retry 3 -o build/tts/piper.tgz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf build/tts/piper.tgz -C build/tts
          VOICE=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ljspeech/high
          curl -sSfL --retry 3 -o build/tts/voice.onnx "$VOICE/en_US-ljspeech-high.onnx"
          curl -sSfL --retry 3 -o build/tts/voice.onnx.json "$VOICE/en_US-ljspeech-high.onnx.json"
          python3 tools/speech/generate_clips.py --phrases core/build/speech/phrases.json \
            --piper build/tts/piper/piper --model build/tts/voice.onnx --out app/src/main/assets/speech
      - name: Seal the embargoed year's data (Burning Man API)
        # The API key lives only in the BURNING_MAN_API_KEY secret. Locations
        # stay sealed in the APK until their release dates; nothing but counts
        # is logged, and nothing is committed.
        env:
          ZEP_BM_API_KEY: ${{ secrets.BURNING_MAN_API_KEY }}
          ZEP_EXTRA_CERTS: ${{ vars.ZEP_EXTRA_CERTS }}
        run: tools/data/build_sealed.sh
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zepdriver-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Build release bundle (for Google Play)
        # Signed with the upload key when its secrets are set; unsigned otherwise.
        env:
          ZEP_UPLOAD_KEYSTORE_B64: ${{ secrets.ZEP_UPLOAD_KEYSTORE_B64 }}
          ZEP_UPLOAD_KEY_PASSWORD: ${{ secrets.ZEP_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$ZEP_UPLOAD_KEYSTORE_B64" ]; then
            export ZEP_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.p12"
            printf '%s' "$ZEP_UPLOAD_KEYSTORE_B64" | base64 -d > "$ZEP_UPLOAD_KEYSTORE"
          else
            echo "No upload key secrets: the bundle is unsigned and can't go to Play."
          fi
          ./gradlew :app:bundleRelease --stacktrace
          rm -f "$RUNNER_TEMP/upload.p12"
      - name: Upload to Google Play (internal testing)
        if: inputs.play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.zepdriver
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: Publish install link (latest-debug pre-release)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk zepdriver-debug.apk
          # The Play bundle, for uploading by hand in Play Console.
          cp app/build/outputs/bundle/release/app-release.aab zepdriver-release.aab
          if unzip -l zepdriver-release.aab | grep -qE 'META-INF/[^/]+\.(RSA|EC|DSA)$'; then
            SIGNED="signed with the upload key"
          else
            SIGNED="UNSIGNED, add the upload key secrets first"
          fi
          # Which sealed data this build carries (a keyed hash); the daily data
          # check compares against it.
          cp build/sealed-fingerprint.txt data-fingerprint.txt 2>/dev/null || echo none > data-fingerprint.txt
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug zepdriver-debug.apk zepdriver-release.aab data-fingerprint.txt \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "ZepDriver — latest test build (#${GITHUB_RUN_NUMBER})" \
            --notes "Debug build ${GITHUB_RUN_NUMBER} from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}.

          On your Android phone, tap **zepdriver-debug.apk** below to download, then open it to install (allow installing from your browser if asked). It installs as \"ZepDriver Test\", next to the Play Store version; newer test builds install over older ones and keep your settings.

          **zepdriver-release.aab** is the Google Play bundle for uploading in Play Console: ${SIGNED}."
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
