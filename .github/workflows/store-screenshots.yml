name: Store screenshots

# Run by hand (Actions tab). Builds the test app, runs it on an Android
# emulator through the debug-only screenshot scenes (ui/ScreenshotScenes.kt,
# tools/store/screenshots.sh) and commits the Play Store phone screenshots to
# store/assets/screenshots/ (1080 × 1920, 16:9, as Play wants), plus the
# foreground service video Play asks for (store/assets/videos/).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the test app (with x86_64 for the emulator)
        run: ./gradlew :app:assembleDebug -Pzep.emulator --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Phone-like memory: the route planner needs more than the emulator default.
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: VIDEO=store/assets/videos tools/store/screenshots.sh app/build/outputs/apk/debug/app-debug.apk store/assets/screenshots
      - name: Keep them as a download too
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: |
            store/assets/screenshots/
            store/assets/videos/
      - name: Commit the screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/assets/screenshots store/assets/videos
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Store screenshots from the emulator (run ${GITHUB_RUN_NUMBER})"
          git push
